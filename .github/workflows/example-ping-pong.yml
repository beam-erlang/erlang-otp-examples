name: Build and test 'ping-pong' example
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Erlangsters OTP distribution version (including revision)
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform.target }} / ${{ matrix.flavor }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
        - runner: ubuntu-24.04
          target: linux-x86_64
        - runner: macos-15
          target: macos-arm64
        - runner: windows-2025
          target: windows-x86_64
        flavor:
        - emu
        - jit
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Select private work directory
      run: echo "WORK=$RUNNER_TEMP/otp-examples-ping-pong" >> "$GITHUB_ENV"
    - name: Install selected distribution
      id: otp
      uses: beam-erlang/setup-erlang-otp@v1
      with:
        version: ${{ inputs.version }}
        flavor: ${{ matrix.flavor }}
    - name: Prepare verified Rebar3 and private directories
      env:
        OTP_PREFIX: ${{ steps.otp.outputs.path }}
        OTP_VERSION: ${{ steps.otp.outputs.version }}
      run: |
        test -x "$OTP_PREFIX/bin/escript"
        test -n "$OTP_VERSION"
        mkdir -p "$WORK" "$WORK/config" "$WORK/cache" artifacts
        printf 'OTP_PREFIX=%s\nOTP_VERSION=%s\nREBAR3=%s/rebar3\nREBAR_CACHE_DIR=%s/cache\nREBAR_GLOBAL_CONFIG_DIR=%s/config\n' "$OTP_PREFIX" "$OTP_VERSION" "$WORK" "$WORK" "$WORK" >> "$GITHUB_ENV"
        curl --fail --location --retry 3 https://github.com/erlang/rebar3/releases/download/3.27.0/rebar3 -o "$WORK/rebar3"
        echo "af85aab41f9fd74bdd6341ebdf6fe9c88077aab9f8eac82371583fa02f2b0bdf  $WORK/rebar3" | sha256sum --check
    - name: Acquire dependencies for ping-pong/server
      working-directory: examples/ping-pong/server
      run: |-
        "$OTP_PREFIX/bin/escript" "$REBAR3" get-deps
        git diff --exit-code -- rebar.lock
    - name: Build and test ping-pong/server offline
      working-directory: examples/ping-pong/server
      env:
        REBAR_OFFLINE: '1'
      run: |-
        "$OTP_PREFIX/bin/escript" "$REBAR3" compile
        "$OTP_PREFIX/bin/escript" "$REBAR3" as prod tar
        git diff --exit-code -- rebar.lock
    - name: Acquire dependencies for ping-pong/client
      working-directory: examples/ping-pong/client
      run: |-
        "$OTP_PREFIX/bin/escript" "$REBAR3" get-deps
        git diff --exit-code -- rebar.lock
    - name: Build and test ping-pong/client offline
      working-directory: examples/ping-pong/client
      env:
        REBAR_OFFLINE: '1'
      run: |-
        "$OTP_PREFIX/bin/escript" "$REBAR3" compile
        "$OTP_PREFIX/bin/escript" "$REBAR3" eunit
        "$OTP_PREFIX/bin/escript" "$REBAR3" escriptize
        git diff --exit-code -- rebar.lock
    - name: Check client errors and deadlines
      run: python3 examples/ping-pong/client/test/smoke.py "$OTP_PREFIX" "$GITHUB_WORKSPACE/examples/ping-pong/client/_build/default/bin/ping-pong-client"
    - name: Run packaged server and client
      run: python3 examples/ping-pong/test/smoke.py examples/ping-pong/server/_build/prod/rel/ping_pong_server/ping_pong_server-0.1.0.tar.gz
        --otp "$OTP_PREFIX" --work-root "$WORK/execution" --client "$GITHUB_WORKSPACE/examples/ping-pong/client/_build/default/bin/ping-pong-client"
    - name: Stage tested artifacts
      run: |-
        cp examples/ping-pong/server/_build/prod/rel/ping_pong_server/ping_pong_server-0.1.0.tar.gz artifacts/
        tar -czf artifacts/ping-pong-client.tar.gz -C examples/ping-pong/client/_build/default/bin ping-pong-client
        mkdir -p artifacts/licenses
        cp LICENSE.txt artifacts/licenses/project
        for dep in examples/ping-pong/server/_build/default/lib/* examples/ping-pong/client/_build/default/lib/*; do
          if [ -f "$dep/LICENSE" ]; then cp "$dep/LICENSE" "artifacts/licenses/$(basename "$dep")"; fi
        done
    - name: Upload tested artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ping-pong-${{ steps.otp.outputs.version }}-${{ matrix.platform.target }}-${{ matrix.flavor }}
        path: artifacts/
        if-no-files-found: error
        retention-days: 14
    - name: Cleanup disposable outputs
      if: always()
      run: |-
        rm -rf "$WORK" artifacts
        find . -type d -name _build -prune -exec rm -rf {} +
